<!DOCTYPE html>
<html lang="de-DE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Wartungsarbeiten - Cinar Grill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #F5E6D3 0%, #F1F3F5 100%);
      color: #2D2D2D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      text-align: center;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 6rem;
      font-weight: 700;
      color: #C1272D;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #495057;
      margin-bottom: 2rem;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #C1272D;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #C92A2A;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 4rem;
      }

      h2 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">🔧</div>
    <h1 aria-label="Fehler 503">503</h1>
    <h2>Wartungsarbeiten</h2>
    <p>
      Wir führen gerade Wartungsarbeiten durch, um Ihnen bald ein noch besseres Erlebnis bieten zu können.
      Bitte versuchen Sie es in wenigen Minuten erneut.
    </p>
    <a href="/" class="btn">Erneut versuchen</a>
    <p style="margin-top: 2rem; font-size: 0.875rem; color: #6C757D;">
      Wir entschuldigen uns für die Unannehmlichkeiten.
    </p>
  </div>

  <script>
    // Auto-reload after 60 seconds
    setTimeout(() => {
      window.location.reload();
    }, 60000);
  </script>
</body>
</html>
