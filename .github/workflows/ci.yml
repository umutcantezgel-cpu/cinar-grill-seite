name: CI - Quality Gates

on:
  push:
    branches: ['main', 'develop', 'claude/**']
  pull_request:
    branches: ['main']

env:
  NODE_VERSION: '20.17.0'

jobs:
  validate:
    name: TypeScript & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  sri-check:
    name: SRI & No-Inline Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate SRI hashes
        run: npm run sri:gen

      - name: Verify SRI coverage
        run: npm run sri:verify

      - name: Check for inline scripts/styles
        run: npm run security:inline

      - name: Upload SRI manifest
        uses: actions/upload-artifact@v4
        with:
          name: integrity-manifest
          path: dist/integrity.manifest.json
          retention-days: 30

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Lighthouse CI
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

  accessibility:
    name: Accessibility Audit (Pa11y + Axe)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Serve site
        run: |
          npm run serve &
          sleep 5
          curl http://localhost:8080 || exit 1

      - name: Run Pa11y
        run: npm run a11y

      - name: Run Axe
        run: npm run a11y:axe
        continue-on-error: true

      - name: Upload a11y results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-results
          path: docs/reports/axe/
          retention-days: 30

  links:
    name: Link Checker
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check links
        run: npm run links

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM (CycloneDX)
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: docs/reports/sbom.json
          retention-days: 90

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [validate, sri-check, lighthouse, accessibility, links]
    steps:
      - name: All checks passed
        run: |
          echo "✅ All quality gates passed!"
          echo "- TypeScript validation: PASS"
          echo "- Build: PASS"
          echo "- SRI coverage: PASS"
          echo "- No inline scripts/styles: PASS"
          echo "- Lighthouse: PASS"
          echo "- Accessibility: PASS"
          echo "- Links: PASS"
          echo ""
          echo "🚀 Ready for deployment!"
